name: CI

on:
  push:
    branches: [ main, staging, develop ]
  pull_request:
    branches: [ main, staging, develop ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Lint with flake8
      run: |
        pip install flake8
        flake8 connector/core connector/azure connector/aws connector/gcp connector/tests --count --max-complexity=10 --max-line-length=127 --show-source --statistics

    - name: Type check with mypy
      run: |
        pip install mypy types-requests
        mypy connector/core --ignore-missing-imports
        # Each cloud adapter is checked separately: azure/, aws/, and gcp/
        # each ship their own secrets_provider.py, and mypy treats same-named
        # modules under different roots as a collision if checked together.
        mypy connector/azure --ignore-missing-imports
        mypy connector/aws --ignore-missing-imports
        mypy connector/gcp --ignore-missing-imports

    - name: Run tests
      run: |
        pytest connector/tests/ --cov=connector/core --cov=connector/azure --cov=connector/aws --cov=connector/gcp --cov-report=xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
